name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format
        run: forge fmt --check
      - name: Build (fails if any contract exceeds EIP-170)
        run: forge build --sizes
      - name: Test (unit, fuzz, invariant)
        run: forge test -vv
      - name: ABIs are up to date
        run: node scripts/export-abis.mjs && git diff --exit-code packages/sdk/src/abis

  typescript:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: forge build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test (includes anvil integration test for the backend)
        run: pnpm -r test
      - name: Build
        run: pnpm -r build
